openapi: 3.0.3
info:
  title: Casa Mia - Chá de Casa Nova
  version: 1.0.0
  description: >-
    One opt-in public list per workspace. Only selected items are published; guest
    identities, emails and messages are private to workspace members. Public
    access requires publication and an active, unblocked paid owner. Reservations
    are atomic and do not mark an item received. Pix is a static BR Code with no
    fixed amount, generated locally; there is no bank integration or payment confirmation.
servers:
  - url: http://localhost:3000/api
paths:
  /public/housewarming/{slug}/events:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: watchPublicHousewarming
      description: SSE refresh events after committed database changes. Contains only an empty object; refetch the public endpoint. Heartbeat every 25 seconds, connection renewed after 10 minutes. Clients retain a 15-second polling fallback.
      responses:
        '200':
          description: Event stream, no personal data.
          content:
            text/event-stream:
              schema: {type: string, example: "event: refresh\ndata: {}\n\n"}
        '404': {description: List unavailable.}
        '429': {description: Per-IP rate limit; Retry-After is supplied.}
  /enxovais/{id}/housewarming/events:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: watchHousewarmingNotifications
      security: [{session: []}]
      description: Same data-free SSE refresh events, for authorized workspace members. Works before the first invitation is saved. Each refresh requires a new authorized read of settings or notifications.
      responses:
        '200': {description: Event stream with refresh events and heartbeats.}
        '401': {description: Authentication required.}
        '403': {description: Paid access required.}
        '404': {description: Workspace not accessible.}
  /public/housewarming/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: getPublicHousewarming
      responses:
        '200':
          description: PublicList; refresh every 15 seconds while visible. Never includes guest or account identity, private notes, prices, or unselected items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicList'
        '404': {description: Missing, unpublished, expired access, inactive or blocked owner.}
        '429': {description: Per-IP rate limit; Retry-After is supplied.}
  /public/housewarming/{slug}/reservations:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      operationId: reserveHousewarmingGift
      description: >-
        Locks the list and item. Exactly one active reservation per item. Copies
        guest name and message into private gift fields and links gift_reservation_id,
        without changing item status. requestId is a fresh UUID generated by the
        caller, reused on network retries; same ID and identical input replays 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GuestInput'
                - type: object
                  required: [itemId, email]
                  properties:
                    itemId: {type: string, format: uuid}
                    email: {type: string, format: email, maxLength: 254}
      responses:
        '201': {description: Reserved; response contains only reservation id.}
        '200': {description: Identical request replay.}
        '400': {description: Invalid UUID, guest input or item selection.}
        '404': {description: List is unavailable.}
        '409': {description: Item already reserved/conquered or requestId reused with different input.}
        '429': {description: Per-IP rate limit; Retry-After is supplied.}
  /public/housewarming/{slug}/messages:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      operationId: leaveHousewarmingMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GuestInput'
                - type: object
                  required: [message]
      responses:
        '201': {description: Private message stored; response contains only id.}
        '200': {description: Identical request replay.}
        '400': {description: Invalid input or empty message.}
        '404': {description: List is unavailable.}
        '409': {description: requestId reused with different input.}
        '429': {description: Per-IP rate limit; Retry-After is supplied.}
  /enxovais/{id}/housewarming:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getHousewarmingSettings
      security: [{session: []}]
      responses:
        '200': {description: 'Workspace member response: list (nullable), selected itemIds, inbox (up to 100 entries, unread first then newest), unreadCount. Inbox contains private guest names/emails/messages and reservation item IDs/status.'}
        '401': {description: Authentication required.}
        '403': {description: Paid access required.}
        '404': {description: Workspace not accessible.}
    put:
      operationId: saveHousewarmingSettings
      security: [{session: []}]
      description: Owner only. Full replacement; itemIds must belong to this workspace, maximum 500. Slug is lowercase and globally unique; changing it invalidates the old URL. Unpublishing immediately disables reads and writes. Pix may be null; otherwise every Pix field is required. Publishing requires at least one item or Pix.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200': {description: Saved list, selected IDs, private inbox and unread count.}
        '400': {description: Invalid settings or foreign item.}
        '401': {description: Authentication required.}
        '403': {description: Owner and paid access required.}
        '404': {description: Workspace not accessible.}
        '409': {description: Slug already taken.}
  /enxovais/{id}/housewarming/notifications:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getHousewarmingNotifications
      security: [{session: []}]
      responses:
        '200': {description: Unread count and latest private notification (nullable); members only.}
        '401': {description: Authentication required.}
        '403': {description: Paid access required.}
        '404': {description: Workspace not accessible.}
  /enxovais/{id}/housewarming/read:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: acknowledgeHousewarmingNotifications
      security: [{session: []}]
      description: Members only. Mark only the supplied, already displayed entry IDs as read for this workspace. New concurrent entries remain unread. Read state is shared by the household.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, maxItems: 100, items: {type: string, format: uuid}}
      responses:
        '204': {description: Entries acknowledged.}
        '400': {description: Invalid IDs.}
        '401': {description: Authentication required.}
        '403': {description: Paid access required.}
        '404': {description: Workspace not accessible.}
  /enxovais/{id}/housewarming/reservations/{reservationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: reservationId
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: cancelHousewarmingReservation
      security: [{session: []}]
      description: Owner only. Releases a researching item, preserves manually edited gift fields, and removes the reservation reference. Received/conquered items must first be returned to researching. Repeated cancellation is harmless.
      responses:
        '204': {description: Reservation released.}
        '400': {description: Invalid UUID.}
        '401': {description: Authentication required.}
        '403': {description: Owner and paid access required.}
        '404': {description: Reservation not found in this workspace.}
        '409': {description: Item is already conquered.}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: enxoval_session}
  parameters:
    Slug: {in: path, name: slug, required: true, schema: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', minLength: 3, maxLength: 80}}
    WorkspaceId: {in: path, name: id, required: true, schema: {type: string, format: uuid}}
  schemas:
    GuestInput:
      type: object
      required: [requestId, name]
      properties:
        requestId: {type: string, format: uuid}
        name: {type: string, minLength: 2, maxLength: 120}
        message: {type: string, maxLength: 500}
    Pix:
      type: object
      nullable: true
      required: [key, keyType, receiverName, city]
      properties:
        key: {type: string, maxLength: 77}
        keyType: {type: string, enum: [cpf, email, phone, random]}
        receiverName: {type: string, minLength: 2, maxLength: 25}
        city: {type: string, minLength: 2, maxLength: 15}
    Settings:
      type: object
      required: [slug, title, message, eventDate, isPublic, itemIds, pix]
      properties:
        slug: {type: string, minLength: 3, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        title: {type: string, minLength: 3, maxLength: 120}
        message: {type: string, maxLength: 1000}
        eventDate: {type: string, format: date, nullable: true}
        isPublic: {type: boolean}
        itemIds: {type: array, maxItems: 500, uniqueItems: true, items: {type: string, format: uuid}}
        pix:
          $ref: '#/components/schemas/Pix'
    PublicList:
      type: object
      required: [slug, title, message, eventDate, pix, items]
      properties:
        slug: {type: string}
        title: {type: string}
        message: {type: string}
        eventDate: {type: string, format: date, nullable: true}
        pix:
          type: object
          nullable: true
          properties:
            key: {type: string}
            receiverName: {type: string}
            payload: {type: string}
        items:
          type: array
          items:
            type: object
            required: [id, name, category, availability]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              category: {type: string}
              availability: {type: string, enum: [available, reserved, gifted]}
