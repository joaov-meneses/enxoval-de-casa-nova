openapi: 3.0.3
info:
  title: Casa Mia receipt review
  version: 1.0.0
  description: Reads a previously uploaded invoice photo locally. Does not modify the item or send the image to an external AI service. Use the existing item PATCH only after the user reviews the proposed fields.
servers:
  - url: http://localhost:3000/api
security:
  - session: []
paths:
  /documents/{id}/read-receipt:
    post:
      operationId: readItemReceipt
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Preview. A cached preview does not spend the daily allowance. Only workspace members can read it.
          content:
            application/json:
              schema:
                type: object
                required: [preview, cached]
                properties:
                  cached: { type: boolean }
                  preview:
                    type: object
                    required: [storeName, purchasedAt, totalCents, confidence, multipleItems, method]
                    properties:
                      storeName: { type: string, maxLength: 80, nullable: true }
                      purchasedAt: { type: string, format: date, nullable: true }
                      totalCents: { type: integer, minimum: 1, maximum: 1000000000, nullable: true }
                      confidence: { type: number, minimum: 0, maximum: 1 }
                      multipleItems: { type: boolean }
                      method: { type: string, enum: [local_ocr] }
              example:
                cached: false
                preview: { storeName: CASA TESTE LTDA, purchasedAt: '2026-10-23', totalCents: 12345, confidence: 0.95, multipleItems: true, method: local_ocr }
        '401': { description: Authentication required. }
        '404': { description: Missing document or user is not a workspace member. }
        '415': { description: Only invoice photos are supported. PDFs and other document types remain available for manual entry. }
        '422': { description: Unsupported or unreadable image. Original document is retained and item is unchanged. }
        '429': { description: Daily attempt limit or request rate exceeded. Default daily limit 20 per user, configurable up to 200. }
        '503': { description: OCR worker busy; retry later. }
        '504': { description: OCR exceeded 45 seconds; retry with a smaller photo. }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: enxoval_session }
