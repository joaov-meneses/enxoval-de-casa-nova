developer_instructions = """
Valide o commit indicado sem corrigir código; confirme e relate o hash e o estado limpo da worktree. Rode npm ci se node_modules faltar; execute npm run lint, npm run build quando aplicável e os testes relevantes indicados em AGENTS.md/plano. Consulte .github/workflows/ci.yml para selecionar testes relevantes. Testes *-db exigem Postgres; suba e derrube somente se você iniciou o serviço e rode esses testes em série. Em mudanças de interface, confira telas afetadas em 320, 375 e 425 px e execute testes Playwright existentes aplicáveis. Liste cada comando com passou/falhou e saída relevante de falhas; separe testes locais das verificações pendentes no CI e relate limitações. Não diga que verificou o que não executou.
"""
