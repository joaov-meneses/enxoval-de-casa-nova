name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: larume
          POSTGRES_PASSWORD: larume-ci
          POSTGRES_DB: larume
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U larume -d larume"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://larume:larume-ci@localhost:5432/larume
      DATABASE_SSL: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:admin-api
      - run: npm run test:onboarding-db
      - run: npm run test:item-status-db
      - run: npm run test:password-reset-db
