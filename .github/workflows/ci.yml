name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: casamia
          POSTGRES_PASSWORD: casamia-ci
          POSTGRES_DB: casamia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casamia -d casamia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://casamia:casamia-ci@localhost:5432/casamia
      DATABASE_SSL: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:admin-api
      - run: npm run test:onboarding-db
      - run: npm run test:item-status-db
      - run: npm run test:password-reset-db
      - run: npm run test:invitations-db
      - run: npm run test:product-scraper
      - run: npm run test:price-tracking-db
      - run: npm run test:jev
      - run: npm run test:ai-db
      - run: npm run test:freemium-db
      - run: npm run test:catalog
      - run: npm run test:catalog-db
      # Só este passo usa o Redis: nos outros, uma resposta do Jev vinda do cache atrapalharia a contagem de chamadas.
      - run: npm run test:shared-cache
        env:
          REDIS_URL: redis://127.0.0.1:6379
