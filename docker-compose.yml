# PostgreSQL de desenvolvimento do Casa Mia.
# Variáveis lidas do .env (veja .env.example). Uso: npm run db:up
name: casamia

services:
  db:
    image: postgres:16-alpine
    container_name: casamia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casamia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-casamia}
      # Permitem usar `psql` dentro do container sem informar usuário/banco.
      PGUSER: ${POSTGRES_USER:-casamia}
      PGDATABASE: ${POSTGRES_DB:-casamia}
    ports:
      # Só localhost. 5433 evita conflito com outros Postgres locais na 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - casamia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis opcional (cache compartilhado entre instâncias, Fase 6). Só sobe com: npm run redis:up
  # Com ele, use REDIS_URL="redis://localhost:6380" no .env. Sem ele, o app usa o cache de cada processo.
  redis:
    image: redis:7-alpine
    container_name: casamia_redis
    profiles: ["cache"]
    restart: unless-stopped
    ports:
      # Só localhost. 6380 evita conflito com outros Redis locais na 6379.
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  casamia_pgdata:
